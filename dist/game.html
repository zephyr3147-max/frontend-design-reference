<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="螃蟹与五位动物车手的三圈海岸竞速赛。"><meta name="theme-color" content="#163441"><title>Crab Coast · 海岸巡回赛</title><link rel="icon" href="./assets/zhzb.svg"><link rel="stylesheet" href="race.css?v=map-clearance1"><script src="race.js?v=map-clearance1" defer></script><script src="race-renderer.js?v=map-clearance1" defer></script><script src="race-view.js?v=map-clearance1" defer></script></head>
<body><canvas id="world" tabindex="0" aria-label="海岸竞速：W加速，S倒车，A和D转向，Shift刹车，空格漂移，J跳跃，P暂停"></canvas><button class="course-switch" id="choose-course" aria-label="选择赛道">赛道 ▾</button><div class="vignette" aria-hidden="true"></div>
<header class="race-header"><div class="place-block"><div class="place"><span id="rank">6</span><small> / 6</small></div><div class="race-meta"><p id="lap-line">第 <span id="lap">1</span> / <span id="lap-total">3</span> 圈</p><time id="clock">0:00.0</time></div></div><div class="race-brand"><strong>Coast Sprint</strong><span>海岸巡回赛</span></div><nav class="actions" aria-label="游戏工具"><a href="./#home" aria-label="返回主页" title="返回主页">↖</a><button id="camera" aria-label="视角复位" title="视角复位">◎</button><button id="pause" aria-label="暂停或继续" title="暂停 / P">Ⅱ</button><button id="reset" aria-label="重新比赛" title="重新比赛 / R">↻</button></nav></header>
<aside class="map-box" aria-label="赛道小地图"><div class="map-title"><span id="course-name">海岸大奖赛</span><b id="map-format">3 laps</b></div><canvas id="map" width="232" height="180" aria-label="红色箭头是你，其他色点是对手"></canvas><div class="map-note"><i></i>箭头是你 · 黄色为前方道路</div></aside>
<div class="speed-hud"><div class="speed-line"><strong id="speed">0</strong><span>km/h</span></div><div class="speed-limit">常规 72 · 冲刺 90 km/h</div><div class="speed-meter"><i id="speed-fill"></i></div></div><div class="route-progress">已骑行 <span id="distance">0</span> m<div><i id="progress-fill"></i></div></div><div class="keyboard-help"><b>W / S</b> 加速 / 倒车　<b>A / D</b> 转向<br><b>Shift</b> 刹车　<b>空格</b> 漂移　<b>J</b> 跳跃 · 拖动调整视角</div><div class="mobile-help">左手转向 · 按住漂移自动加速 · 松手出弯冲刺</div>
<div class="drift-meter" id="drift-meter" hidden><span id="drift-label">漂移蓄力</span><div><i id="drift-fill"></i></div></div><div id="countdown" class="countdown" role="status" aria-live="polite"></div><div id="game-state" class="game-state" role="status"></div>
<div class="joystick" id="joystick" aria-label="方向轮盘：左右拖动转向" tabindex="0"><span class="stick" id="stick">↔</span></div><div class="pedals"><button data-key="back" class="reverse-key" aria-label="倒车">R</button><button data-key="brake" class="brake-key">刹车</button><button data-key="forward" class="accelerator-key" aria-label="加速"><b aria-hidden="true">⇧</b><span>加速</span></button></div><button class="drift-control" data-key="drift" aria-label="漂移并持续加速">漂移＋油门</button><button class="jump-control" data-key="jump">跳跃 ↑</button>
<div class="race-panel" id="race-panel"><section class="race-card" role="dialog" aria-labelledby="panel-title"><div class="card-label">Crab Coast / 海岸车手杯</div><label class="course-picker">选择赛道<select id="course-select" aria-label="选择赛道"><option value="coast">海岸大奖赛 · 急弯与短直道</option><option value="mountain">山路挑战 · S弯与折返</option><option value="rally">海岸拉力 · 起点到终点</option></select></label><h1 id="panel-title">海岸巡回赛</h1><p id="panel-description"></p><div class="race-details" id="race-details"><div><b id="course-format">3</b><span id="course-unit">比赛圈数</span></div><div>6<span>参赛车手</span></div><div>72 km/h<span>最高速度</span></div></div><div class="roster" id="roster" aria-label="螃蟹、兔子、狐狸、熊猫、青蛙和猫"><span>🦀</span><span>🐰</span><span>🦊</span><span>🐼</span><span>🐸</span><span>🐱</span><small>强劲对手</small></div><div class="results" id="results"></div><button class="start-button" id="start"><b id="start-label">开始比赛</b><span aria-hidden="true">↗</span></button><p class="start-help">短漂松手冲刺 · 极速可短暂达到90 km/h</p></section></div><div class="course-chooser" id="course-chooser" hidden><section role="dialog" aria-modal="true" aria-labelledby="chooser-title"><h2 id="chooser-title">选择赛道</h2><p>确认切换后，将重新开始所选赛道。</p><select id="quick-course-select" aria-label="选择新的赛道"><option value="coast">海岸大奖赛 · 急弯与短直道</option><option value="mountain">山路挑战 · 连续S弯与折返</option><option value="rally">海岸拉力 · 起点到终点</option></select><div><button id="cancel-course">取消，继续比赛</button><button id="confirm-course">切换赛道</button></div></section></div><div id="error" role="alert"></div></body></html>
