<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The personal space of ZhZb. Journal and Crab Coast.">
  <meta name="theme-color" content="#f7f7fa">
  <title>ZhZb / Personal space</title>
  <link rel="icon" href="./assets/zhzb.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/caveat.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./home.css?v=orbit5">
  <link rel="stylesheet" href="./aperture.css?v=frost3">
  <script src="./home.js?v=frost2" defer></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="replay" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/></symbol>
    <symbol id="tiny-journal" viewBox="0 0 48 48"><rect x="11" y="7" width="29" height="35" rx="7" fill="var(--mascot-fill,#fff)"/><path d="M17 8v33M8 15h6M8 24h6M8 33h6M24 16h9"/><circle cx="25" cy="26" r="1.3" class="eye"/><circle cx="34" cy="26" r="1.3" class="eye"/><path d="M27 32q3 3 5 0"/></symbol>
    <symbol id="tiny-crab" viewBox="0 0 48 48"><path d="m12 30-6 4m8 2-5 5m27-11 6 4m-8 2 5 5M12 26 7 19m29 7 5-7M18 23l-1-7m13 7 1-7"/><path d="M9 19C1 20 2 9 6 8l1 6 6-3c3 4 1 8-4 8ZM39 19c8 1 7-10 3-11l-1 6-6-3c-3 4-1 8 4 8Z" fill="var(--mascot-fill,#fff)"/><ellipse cx="24" cy="30" rx="14" ry="10" fill="var(--mascot-fill,#fff)"/><circle cx="17" cy="15" r="2.5" class="eye"/><circle cx="31" cy="15" r="2.5" class="eye"/><path d="M21 31q3 4 6 0"/></symbol>
    <symbol id="tiny-camera" viewBox="0 0 48 48"><path d="m16 14 3-6h10l3 6"/><rect x="7" y="14" width="34" height="26" rx="7" fill="var(--mascot-fill,#fff)"/><circle cx="24" cy="27" r="8"/><path d="M21 28q3 3 6 0M34 20h1"/></symbol>
    <symbol id="tiny-music" viewBox="0 0 48 48"><path d="M18 34V12l20-4v22M18 20l20-4"/><ellipse cx="12" cy="35" rx="6" ry="5" fill="var(--mascot-fill,#fff)"/><ellipse cx="32" cy="31" rx="6" ry="5" fill="var(--mascot-fill,#fff)"/></symbol>
    <symbol id="tiny-bookmark" viewBox="0 0 48 48"><path d="M13 8h22v33L24 34l-11 7Z" fill="var(--mascot-fill,#fff)"/><circle cx="20" cy="20" r="1.3" class="eye"/><circle cx="28" cy="20" r="1.3" class="eye"/><path d="M21 26q3 3 6 0"/></symbol>
    <symbol id="tiny-gamepad" viewBox="0 0 48 48"><path d="M14 15h20c7 0 10 22 5 24-4 2-8-7-11-7h-8c-3 0-7 9-11 7-5-2-2-24 5-24Z" fill="var(--mascot-fill,#fff)"/><path d="M12 23h10m-5-5v10M22 8q-2 7 3 7"/><circle cx="32" cy="22" r="1.5" class="eye"/><circle cx="36" cy="27" r="1.5" class="eye"/></symbol>
    <symbol id="tiny-cup" viewBox="0 0 48 48"><path d="M34 19h3c10 0 10 13-3 13M11 19h24v13a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10Z" fill="var(--mascot-fill,#fff)"/><path d="M16 13q-4-3 0-7m9 7q-4-3 0-7M19 31q4 4 8 0"/></symbol>
    <symbol id="tiny-bulb" viewBox="0 0 48 48"><path d="M16 30c-14-13-2-28 9-25 14 2 17 17 7 25l-2 6H18Z" fill="var(--mascot-fill,#fff)"/><path d="M18 36h12m-10 5h8M22 36l-2-13 4 3 4-3-2 13"/></symbol>
    <symbol id="tiny-mail" viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="28" rx="6" fill="var(--mascot-fill,#fff)"/><path d="m8 16 16 12 16-12M8 37l11-12m21 12L29 25M22 6l2 2 2-2"/></symbol>
    <symbol id="tiny-clock" viewBox="0 0 48 48"><circle cx="24" cy="25" r="17" fill="var(--mascot-fill,#fff)"/><path d="M24 14v11l7 4M10 7 5 13m33-6 5 6M13 40l-3 4m25-4 3 4"/></symbol>
    <symbol id="tiny-star" viewBox="0 0 48 48"><path d="m24 5 6 12 13 2-10 10 2 14-11-7-12 7 2-14L4 19l14-2Z" fill="var(--mascot-fill,#fff)"/><circle cx="20" cy="25" r="1.3" class="eye"/><circle cx="28" cy="25" r="1.3" class="eye"/><path d="M22 30q2 2 4 0"/></symbol>
    <symbol id="tiny-rocket" viewBox="0 0 48 48"><path d="M19 29C19 16 30 7 40 7c0 10-9 21-22 22Z" fill="var(--mascot-fill,#fff)"/><path d="m20 20-10 1-4 9 13-1m9-1-1 10-9 4 1-13M14 34l-5 5"/><circle cx="31" cy="16" r="4"/></symbol>
  </svg>

  <section class="welcome" id="welcome" aria-labelledby="welcome-title" tabindex="-1" hidden>
    <h1 class="sr-only" id="welcome-title">Welcome to my space</h1>
    <div class="intro-brand" aria-hidden="true">ZhZb<span>/</span></div>
    <div class="panel-stage" aria-hidden="true">
      <div class="panel-rig">
        <div class="gate-panel panel-nw"></div>
        <div class="gate-panel panel-ne"></div>
        <div class="gate-panel panel-se"></div>
        <div class="gate-panel panel-sw"></div>
      </div>
    </div>
    <div class="side-word word-left" aria-hidden="true"><span>Welcome<span class="welcome-dot">.</span></span></div>
    <div class="side-word word-right" aria-hidden="true"><span>to my space.</span></div>
    <a class="enter-button" id="enter-home" href="#home" aria-label="Go to home"><span class="button-content" aria-hidden="true"><span class="preview-phrase"><span>Made, found</span><span>&amp; remembered</span></span><span class="button-label">Go!</span></span></a>
  </section>

  <div class="home" id="home">
    <header class="topbar shell">
      <a class="brand" href="./#home" aria-label="ZhZb home">ZhZb<span>/</span></a>
      <div class="header-tools">
        <button class="orbit-toggle" id="orbit-toggle" type="button" aria-pressed="false" aria-label="Pause icon rotation" title="Pause / resume rotation" hidden><span aria-hidden="true">Ⅱ</span></button>
        <button class="replay-button" id="replay-welcome" type="button" aria-label="Replay intro" title="Replay intro" hidden><svg class="icon" aria-hidden="true"><use href="#replay"/></svg></button>
      </div>
    </header>
    <main class="home-main shell" aria-labelledby="home-title">
      <div class="orbit-stage">
        <div class="identity"><h1 id="home-title" tabindex="-1" aria-label="Made, found &amp; remembered"><span>Made, found</span><span>&amp; remembered</span></h1></div>
        <nav class="orbit-track" aria-label="Explore">
          <div class="orbit-slot" style="--angle:-90deg;--i:0"><div class="orbit-counter"><a class="app app-journal" href="./journal/" aria-label="Journal"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-journal"/></svg></span><span class="app-name">Journal</span></a></div></div>
          <div class="orbit-slot" style="--angle:-60deg;--i:1"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="相册，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-camera"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:-30deg;--i:2"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="音乐，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-music"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:0deg;--i:3"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="收藏，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-bookmark"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:30deg;--i:4"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="游戏，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-gamepad"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:60deg;--i:5"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="生活，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-cup"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:90deg;--i:6"><div class="orbit-counter"><a class="app app-crab" href="./game.html" aria-label="Crab Coast"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-crab"/></svg></span><span class="app-name">Crab Coast</span></a></div></div>
          <div class="orbit-slot" style="--angle:120deg;--i:7"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="灵感，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-bulb"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:150deg;--i:8"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="信箱，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-mail"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:180deg;--i:9"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="时间，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-clock"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:210deg;--i:10"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="心愿，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-star"/></svg></span><span class="app-name">开发中</span></button></div></div>
          <div class="orbit-slot" style="--angle:240deg;--i:11"><div class="orbit-counter"><button class="app app-pending" type="button" disabled aria-label="探索，开发中"><span class="app-orb"><svg class="mascot" aria-hidden="true"><use href="#tiny-rocket"/></svg></span><span class="app-name">开发中</span></button></div></div>
        </nav>
      </div>
    </main>
    <footer class="shell footer"><span>© <span id="year">2026</span> ZhZb</span><time id="today"></time></footer>
  </div>
</body>
</html>
